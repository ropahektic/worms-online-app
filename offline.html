<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Worms Online</title>
<style>
  body { margin: 0; height: 100vh; display: grid; place-items: center; background: #11151c; color: #e6ebf2; font: 15px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
  .box { max-width: 420px; text-align: center; padding: 24px; }
  h1 { font-size: 22px; margin: 0 0 8px; }
  p { color: #8d99aa; margin: 0 0 16px; }
  code { color: #c5ccd6; font-size: 12px; }
  button { font: inherit; padding: 8px 18px; border-radius: 6px; border: 0; background: #f2b33d; color: #1a1305; font-weight: 600; cursor: pointer; }
</style>
</head>
<body>
<div class="box">
  <h1>Can’t reach wormsonline.net</h1>
  <p>Check your connection. The app retries on its own.</p>
  <p><code id="why"></code></p>
  <button id="retry" type="button">Try now</button>
</div>
<script>
  const q = new URLSearchParams(location.search);
  document.getElementById('why').textContent = q.get('reason') || '';
  const back = () => { location.href = q.get('url') || 'https://wormsonline.net/'; };
  document.getElementById('retry').addEventListener('click', back);
  setTimeout(back, 10000);
</script>
</body>
</html>
