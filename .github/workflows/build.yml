# The app built for macOS (universal .dmg: Apple Silicon and Intel, ad-hoc signed) and Linux
# (.AppImage) on GitHub's machines. Run it from the Actions tab, or push a tag v*. The installers
# are the run's artifacts, with what the app's updater reads (mac .zip, latest-*.yml). (The Windows installer is built on the developer's PC: npm run dist:win)
name: build
on:
  workflow_dispatch:
  push:
    tags: ['v*']
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            cmd: dist:mac
            out: |
              dist/*.dmg
              dist/*.zip
              dist/latest-mac.yml
          - os: ubuntu-22.04
            cmd: dist:linux
            out: |
              dist/*.AppImage
              dist/latest-linux.yml
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npm run ${{ matrix.cmd }}
        env:
          # (no certificate: build/afterpack.js signs the Mac app ad-hoc)
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: WormsOnline-${{ matrix.os }}
          path: ${{ matrix.out }}
